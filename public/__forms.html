<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <!--
      This file exists only so Netlify's build-time form detection registers the
      "enquiry" form. It is never shown to visitors; the real form lives in
      src/components/sections/Contact.tsx and POSTs to this path.
    -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input type="hidden" name="subject" value="New website enquiry" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
